<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jukixyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Syne:wght@300;400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --white: #f5f3ef;
  --dim: rgba(245,243,239,0.45);
  --faint: rgba(245,243,239,0.12);
  --ink: rgba(245,243,239,0.08);
}

html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0a0908;
}

/* ── Background ── */
.bg {
  position: fixed;
  inset: -30px;
  background-image: url("./pixel-alley.png");
  background-size: cover;
  background-position: center;
  filter: blur(6px) brightness(0.55) saturate(0.7);
  transform: scale(1.15);
  opacity: 0;
  z-index: 0;
  transition: opacity 2s ease, transform 2s ease;
}
.bg.reveal { opacity: 1; transform: scale(1.05); }

/* vignette */
.vignette {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(10,9,8,0.82) 100%);
  z-index: 1;
}

/* subtle grain */
.grain {
  position: fixed;
  inset: 0;
  z-index: 2;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 200px;
  pointer-events: none;
}

/* ── Intro flash ── */
#intro {
  position: fixed;
  inset: 0;
  background: #0a0908;
  z-index: 9999;
  pointer-events: none;
}

/* ── Main stage ── */
.stage {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* ── Logo SVG ── */
.logo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.9s ease, transform 0.9s ease;
}
.logo-wrap.show { opacity: 1; transform: translateY(0); }

.glow-halo {
  position: absolute;
  width: 600px;
  height: 200px;
  background: radial-gradient(ellipse, rgba(255,255,255,0.055) 0%, transparent 70%);
  filter: blur(30px);
  pointer-events: none;
}

svg.logo {
  width: min(760px, 82vw);
  overflow: visible;
  display: block;
}

#writePath {
  fill: none;
  stroke: var(--white);
  stroke-width: 4.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter:
    drop-shadow(0 0 3px rgba(255,255,255,1))
    drop-shadow(0 0 10px rgba(255,255,255,0.55))
    drop-shadow(0 0 28px rgba(255,255,255,0.18));
}

/* ── Tagline ── */
.tagline {
  margin-top: 28px;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(13px, 1.6vw, 17px);
  color: var(--dim);
  letter-spacing: 0.25em;
  text-align: center;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 1s ease 0.15s, transform 1s ease 0.15s;
}
.tagline.show { opacity: 1; transform: translateY(0); }

/* ── Divider ── */
.divider {
  margin-top: 36px;
  width: 1px;
  height: 0;
  background: linear-gradient(to bottom, transparent, var(--faint) 40%, var(--faint) 60%, transparent);
  transition: height 0.9s ease 0.3s;
}
.divider.show { height: 48px; }

/* ── Socials ── */
.socials {
  margin-top: 36px;
  display: flex;
  gap: 32px;
  align-items: center;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.9s ease 0.45s, transform 0.9s ease 0.45s;
}
.socials.show { opacity: 1; transform: translateY(0); }

.socials a {
  font-family: 'Syne', sans-serif;
  font-weight: 300;
  font-size: clamp(11px, 1.1vw, 13px);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--dim);
  text-decoration: none;
  position: relative;
  transition: color 0.3s ease;
}
.socials a::after {
  content: '';
  position: absolute;
  bottom: -3px;
  left: 0;
  width: 0;
  height: 1px;
  background: var(--white);
  transition: width 0.35s ease;
}
.socials a:hover { color: var(--white); }
.socials a:hover::after { width: 100%; }

.sep {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--faint);
}

/* ── Corner accent ── */
.corner {
  position: fixed;
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,243,239,0.18);
  opacity: 0;
  transition: opacity 1.2s ease 1s;
  z-index: 20;
}
.corner.show { opacity: 1; }
.corner-tl { top: 28px; left: 32px; }
.corner-tr { top: 28px; right: 32px; text-align: right; }
.corner-bl { bottom: 28px; left: 32px; }
.corner-br { bottom: 28px; right: 32px; }

/* ── Mouse follower ── */
.cursor-glow {
  position: fixed;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, transparent 70%);
  transform: translate(-50%, -50%);
  z-index: 5;
  transition: opacity 0.4s ease;
  opacity: 0;
}
</style>
</head>
<body>

<div id="intro"></div>
<div class="bg"></div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="cursor-glow" id="cursorGlow"></div>

<!-- corner labels -->
<div class="corner corner-tl">Portfolio</div>
<div class="corner corner-tr" id="clockEl"></div>
<div class="corner corner-bl">2025</div>
<div class="corner corner-br">Jukixyo</div>

<div class="stage">
  <div class="logo-wrap">
    <div class="glow-halo"></div>
    <svg class="logo" viewBox="0 0 500 130">
      <path
        id="writePath"
        d="M106.34,89.665C106.34,89.665,165.893,56.182,170.149,19.756C172.576,-1.025,153.427,1.781,150.574,22.905C148.243,40.163,142.404,86.479,142.404,86.479C142.404,86.479,148.021,45.884,166.149,47.671C186.064,50.001,160.021,85.968,183,86.223C203.427,86.45,224.361,68.606,225.127,56.861C226.01,43.319,207.638,41.032,201.978,57.884C196.774,73.379,208.416,90.82,228.46,86.499C259.341,79.84,274.483,35.091,275.936,19.841C277.467,3.756,265.723,2.224,258.574,16.521C251.896,29.878,240.755,83.003,264.958,87.501C293.809,92.862,316.277,40.012,319.086,22.139C321.802,4.852,310.656,-0.034,302.234,15.245C293.166,31.695,279.843,89.995,311.937,87.244C338.746,84.946,328.916,48.182,354.898,45.868C366.562,44.83,371.386,55.838,370.532,66.947C369.638,78.564,358.66,88.393,347.809,86.861C337.898,85.462,332.838,71.891,335.425,62.99C338.617,52.012,348.662,46.038,354.898,45.868C363.766,45.628,368.234,51.245,376.149,51.117C383.179,51.004,390.27,42.996,390.27,42.996"
      />
    </svg>
  </div>

  <p class="tagline">developer &amp; creator</p>

  <div class="divider"></div>

  <nav class="socials">
    <a href="https://github.com/jukixyo" target="_blank">GitHub</a>
    <div class="sep"></div>
    <a href="https://youtube.com/@Jukixyo" target="_blank">YouTube</a>
    <div class="sep"></div>
    <a href="https://www.roblox.com/users/10784521130/profile" target="_blank">Roblox</a>
  </nav>
</div>

<script>
const intro     = document.getElementById("intro");
const path      = document.getElementById("writePath");
const bg        = document.querySelector(".bg");
const logoWrap  = document.querySelector(".logo-wrap");
const logoSvg   = document.querySelector("svg.logo");
const tagline   = document.querySelector(".tagline");
const divider   = document.querySelector(".divider");
const socials   = document.querySelector(".socials");
const corners   = document.querySelectorAll(".corner");
const cursorGlow= document.getElementById("cursorGlow");
const clockEl   = document.getElementById("clockEl");

/* ── Live clock ── */
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  clockEl.textContent = `${h}:${m}:${s}`;
}
updateClock();
setInterval(updateClock, 1000);

/* ── Mouse glow ── */
document.addEventListener("mousemove", e => {
  cursorGlow.style.left = e.clientX + "px";
  cursorGlow.style.top  = e.clientY + "px";
  cursorGlow.style.opacity = "1";
});
document.addEventListener("mouseleave", () => {
  cursorGlow.style.opacity = "0";
});

/* ── Draw animation ── */
const length = path.getTotalLength();
path.style.strokeDasharray  = length;
path.style.strokeDashoffset = length;

window.addEventListener("load", () => {
  /* bg parallax reveal */
  requestAnimationFrame(() => requestAnimationFrame(() => bg.classList.add("reveal")));

  /* fade out intro */
  setTimeout(() => {
    intro.animate([{ opacity:1 },{ opacity:0 }], { duration:600, easing:"ease-out", fill:"forwards" });

    setTimeout(() => {
      /* show logo + draw stroke */
      logoWrap.classList.add("show");

      path.animate(
        [{ strokeDashoffset: length },{ strokeDashoffset: 0 }],
        { duration: 3200, easing: "cubic-bezier(0.4,0,0.2,1)", fill: "forwards" }
      );

      /* staggered UI reveals */
      setTimeout(() => tagline.classList.add("show"),  2800);
      setTimeout(() => divider.classList.add("show"),  3100);
      setTimeout(() => socials.classList.add("show"),  3400);
      setTimeout(() => corners.forEach(c => c.classList.add("show")), 3600);

    }, 300);
  }, 250);
});

/* ── Subtle parallax on bg ── */
document.addEventListener("mousemove", e => {
  const rx = (e.clientX / window.innerWidth  - 0.5) * 8;
  const ry = (e.clientY / window.innerHeight - 0.5) * 8;
  bg.style.transform = `scale(1.05) translate(${rx}px, ${ry}px)`;
});
</script>
</body>
</html>
