<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jukixyo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    background:black;
}

/* Intro Screen */

#intro{
    position:fixed;
    inset:0;

    background:black;

    z-index:9999;

    pointer-events:none;
}

/* Background */

.background{
    position:fixed;
    inset:-20px;

    background-image:url("./pixel-alley.png");
    background-size:cover;
    background-position:center;

    filter:blur(5px) brightness(.8);

    transform:scale(1.12);
    opacity:0;

    z-index:-3;

    transition:
        transform 1.6s ease,
        opacity 1.6s ease;
}

.background.animate{
    transform:scale(1.05);
    opacity:1;
}

@keyframes bgReveal{
    to{
        opacity:1;
        transform:scale(1.05);
    }
}

/* Dark Overlay */

.overlay{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.25);

    z-index:-2;
}

/* Glow */

.logo-glow{
    position:absolute;

    width:800px;
    height:300px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.08),
        transparent 70%
    );

    filter:blur(40px);

    z-index:-1;
}

/* SVG */

svg{
    width:min(1000px,85vw);
    overflow:visible;
}

#writePath{
    fill:none;

    stroke:white;
    stroke-width:5.5;

    stroke-linecap:round;
    stroke-linejoin:round;

    filter:
        drop-shadow(0 0 4px rgba(255,255,255,.9))
        drop-shadow(0 0 12px rgba(255,255,255,.6))
        drop-shadow(0 0 24px rgba(255,255,255,.2));
}

.socials{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);

    display:flex;
    gap:14px;
    align-items:center;

    padding:10px 18px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);

    border-radius:999px;

    color:white;

    font-family:
        Inter,
        system-ui,
        sans-serif;

    font-size:14px;

    opacity:0;

    transition:opacity .8s ease;

    box-shadow:
        0 0 30px rgba(255,255,255,.05);

    z-index:50;
}

.socials.show{
    opacity:1;
}

.socials a{
    color:white;
    text-decoration:none;
    opacity:.8;
    transition:.25s;
}

.socials a:hover{
    opacity:1;
}

.socials span{
    opacity:.35;
}

svg{
    width:min(1000px,85vw);
    overflow:visible;

    opacity:0;
    transform:translateY(8px);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

svg.show{
    opacity:1;
    transform:translateY(0);
}
</style>
</head>
<body>

<div id="intro"></div>

<div class="background"></div>
<div class="overlay"></div>
<div class="logo-glow"></div>

<svg viewBox="0 0 500 500">

<path
id="writePath"
d="M106.34,289.665C106.34,289.665,165.893,256.182,170.149,219.756C172.576,198.975,153.427,201.781,150.574,222.905C148.243,240.163,142.404,286.479,142.404,286.479C142.404,286.479,148.021,245.884,166.149,247.671C186.064,250.001,160.021,285.968,183,286.223C203.427,286.45,224.361,268.606,225.127,256.861C226.01,243.319,207.638,241.032,201.978,257.884C196.774,273.379,208.416,290.82,228.46,286.499C259.341,279.84,274.483,235.091,275.936,219.841C277.467,203.756,265.723,202.224,258.574,216.521C251.896,229.878,240.755,283.003,264.958,287.501C293.809,292.862,316.277,240.012,319.086,222.139C321.802,204.852,310.656,199.966,302.234,215.245C293.166,231.695,279.843,289.995,311.937,287.244C338.746,284.946,328.916,248.182,354.898,245.868C366.562,244.83,371.386,255.838,370.532,266.947C369.638,278.564,358.66,288.393,347.809,286.861C337.898,285.462,332.838,271.891,335.425,262.99C338.617,252.012,348.662,246.038,354.898,245.868C363.766,245.628,368.234,251.245,376.149,251.117C383.179,251.004,390.27,242.996,390.27,242.996"/>

</svg>

<div class="socials">
    <a href="https://github.com/jukixyo" target="_blank">GitHub</a>
    <span>•</span>

    <a href="https://youtube.com/@Jukixyo" target="_blank">YouTube</a>
    <span>•</span>

    <a href="https://www.roblox.com/users/10784521130/profile" target="_blank">Roblox</a>
</div>

<script>

const intro = document.getElementById("intro");
const path = document.getElementById("writePath");
const bg = document.querySelector(".background");
const socials = document.querySelector(".socials");

const length = path.getTotalLength();

path.style.strokeDasharray = length;
path.style.strokeDashoffset = length;

window.addEventListener("load", () => {

    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            bg.classList.add("animate");
        });
    });

    setTimeout(() => {

        intro.animate(
        [
            { opacity: 1 },
            { opacity: 0 }
        ],
        {
            duration: 700,
            easing: "ease-out",
            fill: "forwards"
        });

        setTimeout(() => {

            document.querySelector("svg").classList.add("show");
            path.animate(
            [
                { strokeDashoffset: length },
                { strokeDashoffset: 0 }
            ],
            {
                duration: 3500,
                easing: "ease-in-out",
                fill: "forwards"
            });

            setTimeout(() => {
                socials.classList.add("show");
            }, 3200);

        }, 250);

    }, 300);

});

</script>

</body>
</html>
